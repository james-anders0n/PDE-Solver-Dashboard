[project]
name = "economic-data-prediction-model"
version = "0.1.0"
description = "Point-in-time macro data ingestion and CPI month-on-month forecasting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0.0",
    "yfinance>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_predictor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
